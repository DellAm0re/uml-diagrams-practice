<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1140" viewBox="0 0 1280 1140">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#1b344c} .small{font-size:17px} .msg{font-size:18px} .head{font-size:18px;font-weight:bold}</style>
<text x="640" y="45" text-anchor="middle" font-size="27" font-weight="bold">4. Діаграма послідовності — Робота з Email</text>
<rect x="14" y="86" width="212" height="67" rx="8" fill="#e3efff" stroke="#456c99" stroke-width="2"/>
<text class="head" x="120" y="114" text-anchor="middle">Користувач</text>
<line x1="120" y1="153" x2="120" y2="1060" stroke="#7189a7" stroke-width="2" stroke-dasharray="9,7"/>
<rect x="299" y="86" width="212" height="67" rx="8" fill="#e3efff" stroke="#456c99" stroke-width="2"/>
<text class="head" x="405" y="114" text-anchor="middle">Поштовий клієнт</text>
<text class="small" x="405" y="139" text-anchor="middle">(ПК)</text>
<line x1="405" y1="153" x2="405" y2="1060" stroke="#7189a7" stroke-width="2" stroke-dasharray="9,7"/>
<rect x="609" y="86" width="212" height="67" rx="8" fill="#e3efff" stroke="#456c99" stroke-width="2"/>
<text class="head" x="715" y="114" text-anchor="middle">Email-сервер</text>
<line x1="715" y1="153" x2="715" y2="1060" stroke="#7189a7" stroke-width="2" stroke-dasharray="9,7"/>
<rect x="924" y="86" width="212" height="67" rx="8" fill="#e3efff" stroke="#456c99" stroke-width="2"/>
<text class="head" x="1030" y="114" text-anchor="middle">Сховище листів</text>
<line x1="1030" y1="153" x2="1030" y2="1060" stroke="#7189a7" stroke-width="2" stroke-dasharray="9,7"/>
<line x1="120" y1="201" x2="395" y2="201" stroke="#386890" stroke-width="2.0"/>
<path d="M395 195 L405 201 L395 207" fill="none" stroke="#386890" stroke-width="2"/>
<text x="262.5" y="193" text-anchor="middle" class="msg">1. Створити / надіслати лист</text>
<line x1="405" y1="242" x2="705" y2="242" stroke="#386890" stroke-width="2.0"/>
<path d="M705 236 L715 242 L705 248" fill="none" stroke="#386890" stroke-width="2"/>
<text x="560.0" y="234" text-anchor="middle" class="msg">2. Передати лист (SMTP)</text>
<line x1="715" y1="283" x2="1020" y2="283" stroke="#386890" stroke-width="2.0"/>
<path d="M1020 277 L1030 283 L1020 289" fill="none" stroke="#386890" stroke-width="2"/>
<text x="872.5" y="275" text-anchor="middle" class="msg">3. Зберегти лист</text>
<line x1="1030" y1="324" x2="725" y2="324" stroke="#386890" stroke-width="2.0"/>
<path d="M725 318 L715 324 L725 330" fill="none" stroke="#386890" stroke-width="2"/>
<text x="872.5" y="316" text-anchor="middle" class="msg">4. Підтвердження збереження</text>
<line x1="715" y1="365" x2="415" y2="365" stroke="#386890" stroke-width="2.0"/>
<path d="M415 359 L405 365 L415 371" fill="none" stroke="#386890" stroke-width="2"/>
<text x="560.0" y="357" text-anchor="middle" class="msg">5. Результат надсилання</text>
<line x1="405" y1="406" x2="130" y2="406" stroke="#386890" stroke-width="2.0"/>
<path d="M130 400 L120 406 L130 412" fill="none" stroke="#386890" stroke-width="2"/>
<text x="262.5" y="398" text-anchor="middle" class="msg">6. Показати статус</text>
<line x1="120" y1="447" x2="395" y2="447" stroke="#386890" stroke-width="2.0"/>
<path d="M395 441 L405 447 L395 453" fill="none" stroke="#386890" stroke-width="2"/>
