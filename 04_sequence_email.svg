<line x1="715" y1="611" x2="415" y2="611" stroke="#386890" stroke-width="2.0"/>
<path d="M415 605 L405 611 L415 617" fill="none" stroke="#386890" stroke-width="2"/>
<text x="560.0" y="603" text-anchor="middle" class="msg">11. Передати листи клієнту</text>
<line x1="405" y1="652" x2="130" y2="652" stroke="#386890" stroke-width="2.0"/>
<path d="M130 646 L120 652 L130 658" fill="none" stroke="#386890" stroke-width="2"/>
<text x="262.5" y="644" text-anchor="middle" class="msg">12. Показати отримані листи</text>
<line x1="120" y1="693" x2="395" y2="693" stroke="#386890" stroke-width="2.0"/>
<path d="M395 687 L405 693 L395 699" fill="none" stroke="#386890" stroke-width="2"/>
<text x="262.5" y="685" text-anchor="middle" class="msg">13. Відповісти на лист</text>
<line x1="405" y1="734" x2="705" y2="734" stroke="#386890" stroke-width="2.0"/>
<path d="M705 728 L715 734 L705 740" fill="none" stroke="#386890" stroke-width="2"/>
<text x="560.0" y="726" text-anchor="middle" class="msg">14. Надіслати відповідь</text>
<line x1="120" y1="775" x2="395" y2="775" stroke="#386890" stroke-width="2.0"/>
<path d="M395 769 L405 775 L395 781" fill="none" stroke="#386890" stroke-width="2"/>
<text x="262.5" y="767" text-anchor="middle" class="msg">15. Завантажити лист</text>
<line x1="405" y1="816" x2="705" y2="816" stroke="#386890" stroke-width="2.0"/>
<path d="M705 810 L715 816 L705 822" fill="none" stroke="#386890" stroke-width="2"/>
<text x="560.0" y="808" text-anchor="middle" class="msg">16. Запит вмісту</text>
<line x1="715" y1="857" x2="415" y2="857" stroke="#386890" stroke-width="2.0"/>
<path d="M415 851 L405 857 L415 863" fill="none" stroke="#386890" stroke-width="2"/>
<text x="560.0" y="849" text-anchor="middle" class="msg">17. Вміст листа</text>
<line x1="120" y1="898" x2="395" y2="898" stroke="#386890" stroke-width="2.0"/>
<path d="M395 892 L405 898 L395 904" fill="none" stroke="#386890" stroke-width="2"/>
<text x="262.5" y="890" text-anchor="middle" class="msg">18. Видалити старий лист</text>
<line x1="405" y1="939" x2="705" y2="939" stroke="#386890" stroke-width="2.0"/>
<path d="M705 933 L715 939 L705 945" fill="none" stroke="#386890" stroke-width="2"/>
<text x="560.0" y="931" text-anchor="middle" class="msg">19. Запит видалення</text>
<line x1="715" y1="980" x2="1020" y2="980" stroke="#386890" stroke-width="2.0"/>
<path d="M1020 974 L1030 980 L1020 986" fill="none" stroke="#386890" stroke-width="2"/>
<text x="872.5" y="972" text-anchor="middle" class="msg">20. Видалити зі сховища</text>
<rect x="30" y="1072" width="1220" height="45" rx="6" fill="#f4f8fe" stroke="#a3b9d0"/>
<text x="640" y="1100" text-anchor="middle" class="small">Скасування надсилання можливе до фактичної передачі листа серверу.</text>
</svg>